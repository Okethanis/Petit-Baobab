# Netlify construit le site à chaque modification poussée sur GitHub.
[build]
  command = "node build.js && node admin/photos-fetch.js && if [ \"$CONTEXT\" != production ]; then (pip install -q rapidocr_onnxruntime && python3 admin/photos-ocr.py) || echo photos-ocr ignore; fi"
  publish = "site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- petit-baobab.html build.js images static vendor amenageur photos admin/photos-fetch.js admin/photos-ocr.py package.json netlify"

[[plugins]]
  package = "./netlify/plugins/photos-cache"

[build.environment]
  NODE_VERSION = "22"

# Chaque mise en ligne coûte 15 crédits (300 par mois sur le plan gratuit) :
# on ne reconstruit que si quelque chose qui part sur le site a changé (pas pour admin/, brand/, LISEZMOI…).
