# Netlify construit le site à chaque modification poussée sur GitHub.
[build]
  command = "export PB_BUILD_START=$(date +%s) && node build.js && node admin/photos-fetch.js && { if [ \"$CONTEXT\" != production ]; then (pip install -q rapidocr_onnxruntime imageio-ffmpeg && python3 admin/photos-ocr.py) || echo photos-ocr ignore; fi; } && python3 admin/videos-fetch.py"
  publish = "site"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- petit-baobab.html build.js images static vendor amenageur photos admin/photos-fetch.js admin/photos-ocr.py admin/videos-fetch.py package.json netlify"

[[plugins]]
  package = "./netlify/plugins/photos-cache"

[build.environment]
  NODE_VERSION = "22"

# Chaque mise en ligne coûte 15 crédits (300 par mois sur le plan gratuit) :
# on ne reconstruit que si quelque chose qui part sur le site a changé (pas pour admin/, brand/, LISEZMOI…).
